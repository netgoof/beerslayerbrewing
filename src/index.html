<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beerslayer Brewing Co.</title>
  <meta name="description" content="Beerslayer Brewing Co. — small batch ales. Better get it before it gets you." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="images/favicon-512.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="grain"></div>

  <main class="hero">
    <p class="eyebrow">Small&nbsp;Batch&nbsp;&middot;&nbsp;Handforged&nbsp;Ales</p>

    <div class="badge-wrap">
      <div class="badge-glow" aria-hidden="true"></div>
      <img
        class="badge"
        src="images/beerslayer-logo-optimized.webp"
        alt="Beerslayer Brewing Co. — a chainmail-clad skeletal knight holding a foaming mug of beer and a sword, encircled by the words 'Better get it before it gets you!'"
        width="640"
        height="640"
      />
    </div>

    <p class="tagline">The recipes are being sharpened.</p>
    <p class="subcopy">Beerslayer Brewing Co. is forging something worth the wait. The taproom isn't open yet — but the mug's already full.</p>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 200 12" preserveAspectRatio="none">
        <line x1="0" y1="6" x2="80" y2="6" />
        <path d="M84 1 L96 6 L84 11 L88 6 Z" />
        <line x1="120" y1="6" x2="200" y2="6" />
      </svg>
    </div>

    <p class="coming-soon">Coming soon</p>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 200 12" preserveAspectRatio="none">
        <line x1="0" y1="6" x2="80" y2="6" />
        <path d="M84 1 L96 6 L84 11 L88 6 Z" />
        <line x1="120" y1="6" x2="200" y2="6" />
      </svg>
    </div>

    <p class="eyebrow">On&nbsp;the&nbsp;Docket</p>

    <div class="beer-grid">
      <figure class="beer-card">
        <img
          src="images/lager-left-for-dead.webp"
          alt="Left for Dead Lager label — a grinning monk brewer holding a foaming tankard and a sword"
          width="560"
          height="560"
          loading="lazy"
        />
        <figcaption>
          <span class="beer-name">Left for Dead</span>
          <span class="beer-style">Lager</span>
        </figcaption>
      </figure>

      <figure class="beer-card">
        <img
          src="images/stout-jolly-monk.webp"
          alt="Jolly Monk Stout label — a vintage monastery brewery label with a monk, tankard, and book"
          width="560"
          height="560"
          loading="lazy"
        />
        <figcaption>
          <span class="beer-name">Jolly Monk</span>
          <span class="beer-style">Stout</span>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Beerslayer Brewing Co.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
